    <script>
      // Pick day or night before first paint: saved choice, else the system setting.
      (function () {
        var t = null;
        try { t = localStorage.getItem('yl-theme'); } catch (e) {}
        if (t !== 'day' && t !== 'night') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
        document.documentElement.dataset.theme = t;
      })();
    </script>
